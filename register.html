<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | ChemDist Pro B2B Account Registration</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page">

  <!-- Top Right Floating Action Toggles -->
  <div class="auth-top-actions">
    <button class="icon-btn theme-toggle" aria-label="Toggle Dark Mode">
      <i class="ph ph-moon"></i>
    </button>
    <button class="icon-btn rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL">
      <i class="ph ph-arrows-left-right"></i>
    </button>
  </div>

  <div class="auth-card">
    <div class="auth-header">
      <a href="index.html" class="logo" style="text-decoration: none; margin-bottom: 20px;">
        <img src="assets/images/logo.png" class="logo-mark" alt="ChemDist Pro Logo">
        <span class="logo-text">ChemDist <span class="logo-accent">Pro</span></span>
      </a>
      <h1>CREATE B2B ACCOUNT</h1>
      <p>Register your company for wholesale chemical pricing &amp; Net-30 credit</p>
    </div>

    <form class="validate-form" action="dashboard.html" method="GET">
      <div class="form-group">
        <label class="form-label" for="rg-name" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;">COMPANY / CONTACT NAME</label>
        <input id="rg-name" type="text" class="form-control" name="name" required placeholder="Apex Manufacturing Inc." style="height: 50px; border-radius: 14px;">
        <span class="error-message">Company name is required</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="rg-email" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;">CORPORATE EMAIL ADDRESS</label>
        <input id="rg-email" type="email" class="form-control" name="email" required placeholder="procurement@apexind.com" style="height: 50px; border-radius: 14px;">
        <span class="error-message">Valid corporate email is required</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="rg-pass" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;">PASSWORD</label>
        <div class="password-input-wrap">
          <input id="rg-pass" type="password" class="form-control" name="password" required placeholder="••••••••">
          <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">
            <i class="ph ph-eye"></i>
          </button>
        </div>
        <span class="error-message">Password must be at least 8 characters</span>
      </div>

      <div class="form-group">
        <label class="form-label" for="rg-pass2" style="font-size: 0.75rem; font-weight: 700; letter-spacing: 0.8px; text-transform: uppercase;">CONFIRM PASSWORD</label>
        <div class="password-input-wrap">
          <input id="rg-pass2" type="password" class="form-control" name="confirmPassword" required placeholder="••••••••">
          <button type="button" class="toggle-password-btn" aria-label="Toggle password visibility">
            <i class="ph ph-eye"></i>
          </button>
        </div>
        <span class="error-message">Passwords must match</span>
      </div>

      <div class="auth-consent">
        <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
          <input type="checkbox" required style="width: 16px; height: 16px; margin-top: 2px; accent-color: var(--color-primary);">
          <span>I agree to the <a href="#" class="auth-link">Terms of Sale</a> and <a href="#" class="auth-link">Privacy Policy</a>.</span>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="height: 52px; border-radius: 9999px; font-weight: 700; font-size: 0.875rem; letter-spacing: 1px; text-transform: uppercase;">
        REGISTER ACCOUNT
      </button>
    </form>

    <div class="auth-divider">OR</div>

    <div style="display: flex; flex-direction: column; gap: 4px; margin-bottom: 24px;">
      <button class="social-btn" type="button">
        <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true" focusable="false"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg> Continue with Google Workspace
      </button>
      <button class="social-btn" type="button">
        <i class="ph-fill ph-microsoft-teams-logo" style="font-size: 1.25rem;"></i> Continue with Microsoft 365
      </button>
    </div>

    <p style="font-size: 0.875rem; color: var(--color-text-muted); margin: 0;">
      Already registered? <a href="login.html" class="auth-link auth-link-strong">Login here</a>
    </p>

    <p style="margin-top: 20px;">
      <a href="index.html" class="small muted link-arrow" style="color: var(--color-text-subtle); text-decoration: none; font-size: 0.8125rem;">
        <i class="ph ph-arrow-left"></i> Back to Home
      </a>
    </p>
  </div>

  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>

  <script src="assets/js/main.js"></script>
</body>
</html>
