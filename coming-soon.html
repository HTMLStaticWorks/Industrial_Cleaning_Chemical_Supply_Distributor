<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon | ChemDist Pro</title>
  <link rel="icon" type="image/svg+xml" href="assets/images/favicon.svg">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="auth-page">

  <div class="mesh mesh-1"></div>
  <div class="mesh mesh-2"></div>
  <div class="grid-overlay"></div>

  <div class="container container-narrow" style="text-align: center; position: relative; z-index: 2;">
    <a href="index.html" class="logo" style="justify-content: center; margin-bottom: var(--spacing-5); font-size: 1.75rem;">
      <img src="assets/images/logo.png" class="logo-mark" alt="ChemDist Pro Logo">
      <span class="logo-text">ChemDist <span class="logo-accent">Pro</span></span>
    </a>

    <span class="pill" style="margin-bottom: var(--spacing-4);">
      <span class="dot"></span> Feature In Development
    </span>

    <h1 style="margin-bottom: var(--spacing-3); font-size: clamp(2.25rem, 7vw, 3.75rem);">
      New B2B Tools <span class="serif grad-text">Coming Soon</span>
    </h1>

    <p class="lead" style="max-width: 48ch; margin: 0 auto var(--spacing-5);">
      We're expanding our industrial supply portal with real-time tanker tracking and automated bulk proportioning tools.
    </p>

    <form class="validate-form" style="display: flex; gap: 10px; max-width: 460px; margin: 0 auto; flex-wrap: wrap;" onsubmit="event.preventDefault(); alert('Thank you! You will be notified when this feature goes live.');">
      <div class="form-group" style="flex: 1; min-width: 200px; margin: 0;">
        <label class="form-label" for="cs-email" style="position: absolute; left: -9999px;">Email</label>
        <input id="cs-email" type="email" class="form-control" required placeholder="procurement@company.com">
        <span class="error-message">Valid email is required</span>
      </div>
      <button type="submit" class="btn btn-primary">Notify me</button>
    </form>

    <p style="margin-top: var(--spacing-6);">
      <a href="index.html" class="small muted link-arrow" style="color: var(--color-text-subtle);">
        <i class="ph ph-arrow-left"></i> Back to Home
      </a>
    </p>
  </div>

  <button class="back-to-top" type="button" aria-label="Back to top"><i class="ph ph-arrow-up" aria-hidden="true"></i></button>

  <script src="assets/js/main.js"></script>
</body>
</html>
