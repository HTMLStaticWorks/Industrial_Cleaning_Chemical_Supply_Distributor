<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042225" />
      <stop offset="100%" stop-color="#0A484E" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D99B26" />
    </linearGradient>
    <linearGradient id="tealLiquidGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2BB3BA" />
      <stop offset="100%" stop-color="#12747D" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#042225" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="124" fill="url(#bgGrad)" />

  <!-- Logo Emblem Group -->
  <g transform="translate(56, 40)" filter="url(#glow)">
    <!-- Laurel Leaves Left -->
    <path fill="#12747D" d="M 60 120 C 15 160 5 220 25 280 C 15 230 35 180 60 160 Z M 40 210 C -5 270 5 330 40 380 C 15 320 35 270 60 250 Z M 70 290 C 25 350 45 410 80 435 C 45 390 65 340 90 320 Z"/>
    
    <!-- Laurel Leaves Right -->
    <path fill="#12747D" d="M 340 120 C 385 160 395 220 375 280 C 385 230 365 180 340 160 Z M 360 210 C 405 270 395 330 360 380 C 385 320 365 270 340 250 Z M 330 290 C 375 350 355 410 320 435 C 355 390 335 340 310 320 Z"/>

    <!-- Shield Outer Teal -->
    <path fill="#0D5C63" stroke="url(#goldGrad)" stroke-width="12" d="M 200 20 L 330 70 C 330 230 270 360 200 420 C 130 360 70 230 70 70 Z"/>

    <!-- Inner Gold Laurel Flourishes -->
    <path fill="none" stroke="url(#goldGrad)" stroke-width="10" stroke-linecap="round" d="M 115 150 C 140 200 140 280 115 330 M 285 150 C 260 200 260 280 285 330" opacity="0.9"/>

    <!-- Spray Bottle Assembly -->
    <!-- Spray Head & Nozzle -->
    <path fill="#FFFFFF" d="M 175 110 H 245 L 285 135 C 295 145 290 165 270 165 H 225 L 190 150 Z"/>
    <path fill="#D99B26" d="M 190 165 H 225 V 195 H 190 Z"/>
    
    <!-- Bottle Outline & Fluid -->
    <path fill="#072629" stroke="#FFFFFF" stroke-width="12" stroke-linejoin="round" d="M 190 195 C 175 240 135 280 135 345 C 135 390 165 405 200 405 C 235 405 265 390 265 345 C 265 280 225 240 210 195 Z"/>
    <path fill="url(#tealLiquidGrad)" d="M 142 315 C 175 335 225 305 258 315 C 264 330 263 380 245 395 H 155 C 137 380 136 330 142 315 Z"/>
    
    <!-- Bubbles inside liquid -->
    <circle cx="175" cy="350" r="10" fill="#FFFFFF" opacity="0.7"/>
    <circle cx="225" cy="335" r="7" fill="#FFFFFF" opacity="0.7"/>

    <!-- Golden Sparkles -->
    <path fill="url(#goldGrad)" d="M 280 60 C 280 90 295 105 325 105 C 295 105 280 120 280 150 C 280 120 265 105 235 105 C 265 105 280 90 280 60 Z"/>
    <path fill="url(#goldGrad)" d="M 125 90 C 125 105 135 115 150 115 C 135 115 125 125 125 140 C 125 125 115 115 100 115 C 115 115 125 105 125 90 Z"/>
  </g>
</svg>
